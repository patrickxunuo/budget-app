name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test database migrations and RLS
        run: |
          pnpm db:start
          pnpm test:db
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "APP_URL=http://127.0.0.1:3100"
            echo "CRON_SECRET=ci-local-cron-secret-00000000000000000000"
            echo "PLAID_CLIENT_ID=ci-local-client"
            echo "PLAID_ENV=sandbox"
            echo "PLAID_SECRET=ci-local-secret"
            echo "PLAID_TOKEN_ENCRYPTION_KEY=ci-local-token-key-000000000000000000"
            echo "PLAID_WEBHOOK_URL=http://127.0.0.1:3100/api/plaid/webhook"
            echo "PLAID_E2E_PROVIDER=deterministic"
          } >> "$GITHUB_ENV"
          # `pnpm test:db` ends with `supabase db reset`, so the database now
          # holds no Auth users and the application is invite-only. Without a
          # seeded owner every authenticated journey skips and the run reports
          # green on coverage it never executed — the exact failure GH-14 exists
          # to end. The script is idempotent, refuses any non-loopback Supabase,
          # and appends the fixture credentials it provisions to $GITHUB_ENV
          # itself. It is read from the shell variables above rather than
          # $GITHUB_ENV, which only takes effect in later steps.
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SECRET_KEY" \
            pnpm seed:e2e

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          # The deterministic Plaid journeys cannot run against a production
          # build. The client guard in src/components/plaid/plaid-link-flow.tsx
          # is a compile-time `NODE_ENV !== "production"` check — deliberately,
          # because it stops a forged link-token response from pushing a real
          # member down the fake provider path — and `next start` is
          # NODE_ENV=production. Driving `next dev` is therefore the only honest
          # way to execute them. This is a harness choice and weakens no product
          # control; the `Build` step above still proves the production build
          # compiles, and getPlaidProvider() still refuses anything that is not
          # Sandbox on a loopback origin off Vercel.
          E2E_SERVER_MODE: dev
          # Only the families this job genuinely provisions. A name here that is
          # not provisioned fails the run instead of skipping, which is the
          # point of GH-14 F1. Everything else stays optional and is printed as
          # ABSENT by the end-of-run inventory, so a reader can see what did not
          # execute. Notably excluded, because the seed creates an identity and
          # not financial data:
          #
          #   dashboard          needs accounts, transactions, budget progress
          #   plaid-connection   needs an activated multi-account Item
          #   manual-entries     see the note in e2e/support/fixtures.ts; FE-001
          #                      asserts Personal and Family rows on one page,
          #                      which the scoped ledger cannot satisfy
          E2E_REQUIRED_FIXTURES: plaid,auth-owner,categories,budgets-service-cleanup
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
