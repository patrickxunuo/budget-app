name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test database migrations and RLS
        run: |
          pnpm db:start
          pnpm test:db
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SECRET_KEY"
            echo "APP_URL=http://127.0.0.1:3100"
            echo "CRON_SECRET=ci-local-cron-secret-00000000000000000000"
            echo "PLAID_CLIENT_ID=ci-local-client"
            echo "PLAID_ENV=sandbox"
            echo "PLAID_SECRET=ci-local-secret"
            echo "PLAID_TOKEN_ENCRYPTION_KEY=ci-local-token-key-000000000000000000"
            echo "PLAID_WEBHOOK_URL=http://127.0.0.1:3100/api/plaid/webhook"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
