version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it, so a compromised or
    # broken release is usually caught and pulled before it reaches this
    # repository. Security updates ignore the cooldown and still open at once.
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node must track the Node runtime, not npm's latest. Nothing else
      # anchors it, so Dependabot reached straight for 26 and broke the build on
      # a type that had moved. Raise this ceiling deliberately when the runtime
      # moves, and note that Vercel currently runs a different major than CI.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # plaid 51 reshaped the SDK's exports (Configuration, PlaidApi and the
      # root-level types moved or were renamed), so a major bump fails type-check
      # and needs a deliberate migration of src/lib/plaid. Without this entry
      # Dependabot reopens a failing pull request for every new major. Remove it
      # when the migration is done. Security updates are not affected.
      - dependency-name: "plaid"
        update-types:
          - version-update:semver-major
    groups:
      # One pull request per ecosystem-sized concern keeps the review surface
      # small; security updates stay ungrouped so they can land on their own.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it, so a compromised or
    # broken release is usually caught and pulled before it reaches this
    # repository. Security updates ignore the cooldown and still open at once.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Without a group this block opened five separate pull requests the first
      # time it ran. Action bumps are CI-only and reviewed together anyway, so
      # one pull request per week is the right review surface. Majors are
      # included deliberately: an action major that breaks CI is visible
      # immediately and cannot reach production.
      github-actions:
        update-types:
          - major
          - minor
          - patch
